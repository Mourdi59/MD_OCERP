# Repo hygiene gate.
#
# Twenty-one guards run on every push and pull request, grouped into three
# jobs. They were nineteen separate jobs until 2026-08-24, eighteen of which
# ran exactly one step, each doing its own checkout of an 8764-file tree and
# its own Python install to run a script that finishes in seconds. That is
# nineteen runner slots for about two minutes of actual work, competing for
# the same pool as CI (PostgreSQL), and it starved: runs queued for over two
# hours, queue depth grew across seven consecutive pushes without shrinking,
# and eight commits landed in one morning with no hygiene verdict at all. The
# gate was not slow, it was wide. Nothing here was removed or weakened in the
# regrouping - the same scripts run on the same trigger.
#
# The property that regrouping had to preserve: when the checks were separate
# jobs, one run told you every check that failed. A job stops at its first
# failing step, which would have turned one red run into a queue of pushes
# each revealing the next failure - worse than the queue we were fixing. So
# every check step carries `if: ${{ !cancelled() }}` and runs regardless of
# what failed before it. A failed step still fails its job, so the verdict
# still depends on the whole set; nothing here uses continue-on-error, which
# is the thing that would actually break that. `!cancelled()` rather than
# `always()` so that cancelling a run genuinely releases the slot, which is
# the resource this whole layout exists to conserve.
#
# Where a new check goes: does it read git history (commit-history), locale
# files or the key space (i18n), or the tree itself (structural)?
#
# Some of what these guards cover, kept here because the reasoning is what
# stops someone reversing them later:
#   * no internal-only files (planning, strategy, QA artifacts, audits,
#     runbooks) reach the public repository or a release artifact,
#   * no commit message records an AI assistant as a contributor (a
#     "Co-authored-by:" trailer or "Generated with ..." footer naming one),
#   * no locale value carries a doubled Unicode escape (`\\u2013` instead of
#     `–`), which is syntactically valid so tsc and the build stay green while
#     the string renders as literal garbage, and
#   * no locale value in the whole of en.ts's keyspace goes byte-identical to
#     its source in 24 or more of 28 non-en locales without landing in exactly
#     one of two declared, never-merged lists (i18n_leak_allowlist.json for
#     deliberately-identical terms, i18n_leak_baseline.json for the 455 keys /
#     11606 cells eight incidents shipped this way - six commits on
#     2026-07-26 under a message claiming translation or an ordinary feature
#     commit that happened to add keys along the way, plus two more found
#     independently of that window, below the count threshold, by a second
#     detector). Every key existed and every coverage check passed, because
#     the string was present - it was just the wrong string; nothing caught
#     it until #181 found the first one by hand. The second detector groups
#     keys by the exact SET of locales matching en rather than by count, runs
#     forward-only against a frozen snapshot of already-seen locale-set
#     shapes, and fails only when a genuinely new cluster of 3+ keys forms.
#     See scripts/check_i18n_leak_baseline.py for both fingerprints.
# The file, escape and leak-baseline guards also run as pre-commit hooks; the
# trailer guard runs as a commit-msg pre-commit hook. So a violation is
# caught at commit time and in CI, and the file guard is caught again at
# build time.
name: Repo hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structural:
    name: Whole-tree structural guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tree for internal-only files
        if: ${{ !cancelled() }}
        run: python scripts/check_repo_hygiene.py

      # The version literals are a repo-level invariant, not a backend concern, so
      # they belong beside the other whole-tree guards rather than in a test lane.
      # This check already runs in the CI workflow, and it stays there; it is
      # repeated here because Repo hygiene is a job this project treats as a gate,
      # and the desktop crate had drifted eleven minor releases behind the rest of
      # the tree before anything was reading it at all.
      - name: Check every release version literal agrees
        if: ${{ !cancelled() }}
        run: python scripts/check_version_sync.py

      # The commit has to be able to import itself. A router was once committed
      # clean while the function it imported stayed in a working tree, so a fresh
      # clone could not start the application at all, and every local run passed
      # because every local run reads the working tree. This reads git blobs
      # instead, which is the only place the difference is visible.
      - name: Check every intra-app import against the committed tree
        if: ${{ !cancelled() }}
        run: python scripts/check_head_imports.py

      # A case step is a link the reader clicks. /pipelines was linked from the
      # sidebar and stepped through by a shipped case for as long as the module
      # existed, with no Route ever declared, so the walkthrough dead-ended and
      # nothing compared the two lists.
      - name: Check case step targets against the route table
        if: ${{ !cancelled() }}
        run: python scripts/check_case_routes.py

      # An unregistered key resolves to False for every role while admin
      # short-circuits above the check, so the route is admin-only in
      # production and every admin-authenticated test still passes. The
      # failure needs a non-admin user to appear at all, which is why this is
      # a static check and not a test.
      - name: Check permission keys against the registry
        if: ${{ !cancelled() }}
        run: python scripts/check_permission_registration.py

      # A collection endpoint moving from a bare array to {items, total,
      # offset, limit} breaks every caller left behind. The build catches most
      # of it and structurally cannot catch the case this guards: React Query
      # caches by key, the key is a string, so a file sharing queryKey with a
      # migrated one gets handed the wrong shape at runtime while tsc is
      # green. The script self-tests before it scans, so a run that passes has
      # also just demonstrated it can fail.
      - name: Check every consumer of a migrated endpoint moved with it
        if: ${{ !cancelled() }}
        run: python scripts/check_page_envelope_consumers.py

      # The other half of the check above. That one stops a migrated endpoint
      # leaving a caller behind; this one stops the tree adding bare-list
      # routes faster than the waves remove them. Only the waves were ever
      # counted, so the census could fall while the debt grew and the numbers
      # would look identical either way. The allowlist here IS the census: its
      # size prints on every green run, an entry that no longer names a live
      # route fails rather than lingering, and the number therefore only goes
      # down by someone doing the work.
      - name: Check no new GET route answers with a bare array
        if: ${{ !cancelled() }}
        run: python scripts/check_no_new_bare_list_endpoints.py

      # Grew out of #126: a migration that rewrote a 1724 MB table inside the
      # single transaction Alembic wraps a whole upgrade() in died with
      # DiskFull on a real box. Rewriting pre-existing data is legitimate and
      # this does not forbid it - it fails only when a flagged revision has
      # no "# data-rewrite-ack: table=... growth=... rows=..." comment for a
      # table it touches, so the size question gets asked before a revision
      # ships rather than after it lands on a customer's disk. See the
      # module docstring in the script for the acknowledgement format.
      - name: Check migrations that rewrite pre-existing data are acknowledged
        if: ${{ !cancelled() }}
        run: python scripts/check_migration_data_rewrites.py

      # Same set of revisions, the other question: does the rewrite reach
      # anybody. Nothing in this product runs `alembic upgrade`; the schema
      # moves at boot through postgres_auto_migrate plus create_all, neither of
      # which executes a revision body, and stamp_head_if_unstamped then records
      # the database at head. So a backfill, a rename or a de-duplication runs
      # only where an operator runs alembic by hand, and every signal we have
      # reports success either way - which is how v3271_formwork_debrand left
      # trademarked rows in customer databases for eleven months. This fails
      # when a revision that rewrites pre-existing rows does not say where that
      # rewrite lands, and prints every declared gap on every run.
      # This was held back for a while and the reason is worth keeping. The step
      # went in before its script did, so every run died on "can't open file"
      # and carried the whole lane red, which hid a real finding in the step
      # above: a lane that is red for a reason unrelated to what it checks
      # reports nothing at all, which is worse than not having the gate. The
      # script came back without the registry it reads, which failed the same
      # way somewhere quieter, passing against a working tree that still held
      # the uncommitted files and failing against a clean clone. Both halves
      # are in the tree now, and this step is what would catch the third time.
      - name: Check data-rewrite migrations declare where the rewrite lands
        if: ${{ !cancelled() }}
        run: python scripts/check_data_rewrite_boot_repair.py

      # A fork in the revision graph is invisible to the person who made it:
      # each author runs `alembic heads` inside their own branch of work, sees
      # one head and is telling the truth, because they ran before the other
      # revision existed. It only shows in the union, which is what CI is. An
      # ambiguous head makes `alembic upgrade head` refuse to run, so without
      # this the fork is found by whoever upgrades first, and on a release that
      # is the user. Reads the revision files rather than importing Alembic, so
      # it needs no database and cannot hang on a driver import.
      - name: Check the migration graph has a single head
        if: ${{ !cancelled() }}
        run: python scripts/check_migration_heads.py

      # The backend suite holds 99 fixed date constants across 77 files naming
      # 40 distinct instants: NOW is five different days, TODAY is six, AS_OF
      # is 2025-01-01 in one file and 2026-07-16 in another. None of that is a
      # bug today, because every one of them is file-local and nothing lets two
      # of them meet in a single run. It becomes a bug the moment somebody adds
      # a date to a conftest or a shared helper, because then a test pinning
      # one instant locally and a helper reading the shared one disagree about
      # what day it is inside one run, and that surfaces far from either date.
      # Rewriting 99 correct constants to defend against a fixture nobody has
      # proposed is churn; forbidding the fixture is one check. Parameter
      # defaults and documents that merely contain a date are not anchors and
      # are not flagged. See the module docstring for what it cannot see.
      - name: Check no shared date anchor has been added to the test suite
        if: ${{ !cancelled() }}
        run: python scripts/check_shared_test_clock.py

      # Ten font files under three licences ship inside the wheel and the
      # desktop installer. Neither pip-licenses nor license-checker can ever
      # list them, because both enumerate installed packages and a committed
      # binary is not a package, so the generated inventory named every
      # dependency we have except these and nothing went red for the life of
      # the product. The obligation itself was being met the whole time by a
      # licence file travelling beside the fonts; what was wrong was our own
      # summary documents.
      #
      # This checks the packaged result rather than the tree. "A licence file
      # sits next to the font" would pass a future _LICENSE.txt that
      # backend/pyproject.toml then silently drops from the wheel via
      # exclude = ["**/_*.txt"], which is the guard reintroducing the failure
      # it exists to prevent. The exclude patterns are read out of
      # pyproject.toml at run time so this follows any edit to them.
      - name: Check every bundled font carries its licence into the artefact
        if: ${{ !cancelled() }}
        run: python scripts/check_bundled_font_licences.py

      # Last in the job on purpose. It is the only step here that installs
      # anything, and the eight guards above finish in seconds; putting the
      # install ahead of them would make every one of them wait on a dependency
      # resolver. Steps rather than a fourth job because the resource this
      # layout exists to conserve is runner slots, and a new job would take one
      # while doing its own checkout of the same 8764-file tree.
      #
      # The instrument itself is stdlib-only, but the registries it reads live
      # in modules that import pydantic and dateutil. Measured in a bare 3.12
      # environment the check exits 1 with 27 probes unresolved, so this install
      # is what makes the step below a gate rather than a permanent red light.
      - name: Install the backend for the country coverage instrument
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          mkdir -p ../frontend/dist
          touch ../frontend/dist/.gitkeep
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      # This job has no PostgreSQL service and that is the point rather than an
      # accident of where the step landed. With no cluster the probes cannot
      # import the modules their registries live in, so they fall back to the
      # isolated source reads, and those are the paths that were broken and
      # silent for a day while every test stayed green. The PostgreSQL lane
      # imports everything cleanly, which makes it the one environment that
      # structurally cannot see an instrument defect.
      #
      # What this catches, and only this: the instrument unable to run at all,
      # which exits 1 and names the package that is missing, and a country that
      # has fallen to zero covered and zero fallback dimensions, which --strict
      # exits 2 on. A census that cannot read its registry is an exit 1 here too.
      #
      # What it does not catch is the larger half, written down because a gate
      # that documents its own floor is the only kind that does not quietly
      # become a ceiling. A country losing one dimension of eleven passes here
      # green, and so does coverage sliding from ten dimensions to two. This is
      # a floor, not a ratchet. It is deliberately not named for coverage
      # without qualification: a step believed to gate coverage while detecting
      # only a dead environment and a total collapse is worse than no step at
      # all. The cohort is nine hardcoded codes, so a country added to the
      # jurisdiction register is invisible here until somebody edits this file.
      #
      # The real coverage number is a jurisdiction commitment and belongs in the
      # founder's register, where moving it is a decision somebody makes rather
      # than a threshold somebody bumps to get a build green.
      #
      # On --ignore-unprobed. The instrument now walks the tree for country
      # shaped registries and fails when it finds one no probe reads, because a
      # registry nobody asks about is counted neither as covered nor as missing
      # and every percentage on the page is quietly a percentage of what the
      # tool happens to know about. Fifty-three are in that state today. The
      # census still prints here, in full, with every unprobed registry named;
      # what the flag suppresses is only the exit code, so this step keeps
      # exactly the floor described above and does not silently become a
      # different gate. Making it fail would leave this lane permanently red
      # until a probe exists for every registry, and a lane that is always red
      # is one somebody deletes at three in the morning, after which it guards
      # nothing for real rather than nothing on paper. Note what it would not
      # do: main carries deletion, non-fast-forward and linear-history rules and
      # no required status checks at all, so no lane here blocks a push today.
      # Whether any check should be required is a repository settings decision
      # and belongs with the founder alongside the coverage number itself. The instrument fails loudly by default for anybody running it by
      # hand, and tests/unit/test_country_coverage.py gates the census machinery
      # in the PostgreSQL lane.
      #
      # That failure has its own exit code, 3, rather than reusing 1. A caller
      # reading 1 is told the numbers cannot be trusted because something would
      # not load; 3 says every number printed is sound and the divisor is short,
      # and those need different answers. It matters here because 3 is checked
      # before the --strict floor and would otherwise hide it: with the flag on,
      # this step can still fail with 2 when a country has nothing anywhere,
      # which is the floor it is named for.
      - name: Check the instrument runs and no country has fallen to zero
        if: ${{ !cancelled() }}
        run: python backend/scripts/country_coverage.py --strict --ignore-unprobed US CA DE BG RU CN IN BR NG

      # No competitor or vendor product name ships, in code, UI strings,
      # changelog or docs. That rule had one enforcement point, the CI workflow,
      # and a rule enforced in exactly one place that nobody reads is not
      # enforced: CI is chronically red for reasons of its own, so a red brand
      # check there carries no information, and one sat red on a partner pack
      # while later commits landed straight over it. Repeated here for the same
      # reason the release version literals above are repeated here.
      #
      # Kept in CI as well rather than moved. The two workflows run in parallel,
      # so keeping it there costs nothing, and a check reported twice is harder
      # to lose than a check reported once.
      #
      # Last in the job deliberately: it reads every tracked text file, 8546 of
      # them the day it landed, so the cheaper structural guards get to report
      # their verdict before it starts.
      - name: Check no competitor or vendor brand token is in the tree
        if: ${{ !cancelled() }}
        run: python scripts/check_no_brand_tokens.py

  i18n:
    name: Locale and i18n guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Two libraries, not the application's dependency tree. The guards below
      # need a parser and the translation runtime, and pinning both to the
      # versions the build uses is the whole point: a bundle that parses under
      # some other compiler, or resolves under some other i18next, is not the
      # question anyone is asking. typescript is read out of devDependencies and
      # i18next out of dependencies, because i18next ships in the product.
      #
      # One command rather than two on purpose. `npm install <spec>` rebuilds
      # the tree it is pointed at rather than adding to it, so a second
      # --no-save install can leave the first one's package gone, and the guard
      # that needed it would fail for a reason that has nothing to do with what
      # it guards. Naming both specs in one call cannot get into that state.
      - name: Install the compiler and the i18next the application uses
        working-directory: frontend
        run: |
          tsv=$(node -p "require('./package.json').devDependencies.typescript")
          i18nv=$(node -p "require('./package.json').dependencies.i18next")
          echo "installing typescript@$tsv and i18next@$i18nv, as declared by the application"
          npm install --no-save --no-audit --no-fund "typescript@$tsv" "i18next@$i18nv"

      # First, because every guard below it answers a question about the
      # contents of a file that has to load before any of those answers matter.
      #
      # This is here because a bundle shipped with a missing comma between two
      # keys and every locale guard in this job went green over it. That is not
      # bad luck. Each of them reads the locale as data with its own reader, and
      # no reader of that kind cares about the separators holding the file
      # together. They answer what is in the file. Whether the application can
      # load the file was answered by nobody, because none of them is the thing
      # that loads it. Adding a twelfth guard of the same kind would not have
      # helped; guards that share a blind spot are one guard.
      #
      # So this one does not bring its own parser. It asks the compiler, which
      # is the only reader whose opinion decides whether the product starts.
      # Parsing is not type checking, so it costs about a second per bundle and
      # runs here rather than waiting for a thirteen minute build.
      - name: Check every locale bundle parses and declares no key twice
        if: ${{ !cancelled() }}
        run: node scripts/check-locales-parse.mjs
        working-directory: frontend

      # Next after the parse guard, because it asks the next question in the
      # same chain. That one asks whether a bundle can be loaded at all. This
      # one asks what comes out when the thing that loads it is asked to render.
      #
      # Nothing asked that before. Rewriting 30,964 t() calls into bare literals
      # left the suite 91 of 91 green, because the harness mock returns
      # defaultValue verbatim and almost every call site passes one. Corrupting
      # all 38,895 German values turned exactly one assertion red, in a file
      # nothing runs before merge. The only two tests that raise real i18next
      # both swap a three key fixture in for the dictionary, on purpose and with
      # a sound reason, which leaves the shipped dictionary on the far end of no
      # real t() call anywhere in this repo.
      #
      # The self test runs first, and it has to. It builds locales in memory,
      # one copied from English and one with a value blanked, and fails if the
      # detectors stay quiet on them. Without it a detector that had stopped
      # firing would report a clean tree, and the tree would look like it got
      # better. Same order, and the same reason, as the accessibility ratchet
      # further down.
      - name: Check the locale render guard can still see its own defects
        if: ${{ !cancelled() }}
        run: node scripts/check-locale-render.mjs --selftest
        working-directory: frontend

      - name: Check every offered locale renders its own language
        if: ${{ !cancelled() }}
        run: node scripts/check-locale-render.mjs
        working-directory: frontend

      - name: Check locale files for doubled escapes
        if: ${{ !cancelled() }}
        run: python scripts/check_locale_escapes.py

      - name: Check for new i18n leaks against the declared baseline
        if: ${{ !cancelled() }}
        run: python scripts/check_i18n_leak_baseline.py

      - name: Check for t() keys no locale file can answer
        if: ${{ !cancelled() }}
        run: python scripts/check_i18n_orphan_keys.py

      - name: Check computed t() keys against the English bundle
        if: ${{ !cancelled() }}
        run: python scripts/check_i18n_computed_keys.py

      - name: Check module display names are reachable, undrifted and unorphaned
        if: ${{ !cancelled() }}
        run: python scripts/check_module_display_names.py

      - name: Check counted keys for missing CLDR plural forms
        if: ${{ !cancelled() }}
        run: python scripts/check_i18n_plural_forms.py

      - name: Check translations ask only for variables the call site passes
        if: ${{ !cancelled() }}
        run: python scripts/check_i18n_placeholder_parity.py

      - name: Check for keys written beside the translation object
        if: ${{ !cancelled() }}
        run: python scripts/check_i18n_key_nesting.py

      - name: Prove the case playbook catalogue gate can fail
        if: ${{ !cancelled() }}
        run: python scripts/check_case_playbook_catalogue_locales.py --selftest

      - name: Check a new case playbook has not un-finished a finished language
        if: ${{ !cancelled() }}
        run: python scripts/check_case_playbook_catalogue_locales.py

      - name: Prove the payment application sense gate can fail
        if: ${{ !cancelled() }}
        run: python scripts/check_payment_application_sense.py --selftest

      - name: Check a payment application still reads as a claim, not an app
        if: ${{ !cancelled() }}
        run: python scripts/check_payment_application_sense.py

      - name: Check for values written in someone else's alphabet
        if: ${{ !cancelled() }}
        run: python scripts/check_i18n_script_mixing.py

      # The control runs BEFORE the ratchet on purpose. If a detector stops
      # firing, the ratchet reports a clean tree and the tree looks like it got
      # better, so the order is what keeps a green result meaningful.
      - name: Check the accessibility ratchet can still see its own defects
        if: ${{ !cancelled() }}
        run: python scripts/check_a11y_attribute_ratchet.py --selftest

      - name: Check for attributes that never translate and controls with no name
        if: ${{ !cancelled() }}
        run: python scripts/check_a11y_attribute_ratchet.py

      - name: Check locale files for stripped escape backslashes
        if: ${{ !cancelled() }}
        run: python scripts/check_locale_lost_escapes.py

      - name: Check locale files for homoglyph-mixed words
        if: ${{ !cancelled() }}
        run: python scripts/check_locale_mixed_script.py

  # Alone deliberately, and it has to stay alone. This is the only guard that
  # reads git history rather than the working tree, so it is the only one that
  # needs fetch-depth: 0. Folding it into either job above would hand it the
  # default shallow checkout, where it would scan the single commit it can see,
  # find nothing, and pass - a green tick for a guard that had stopped running.
  # A one-step job next to two ten-step jobs looks like an oversight; it is not.
  commit-history:
    name: Commit history guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the guard scans every commit reachable from HEAD,
          # not just the tip; the tree is clean today and must stay that way.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan commit messages for AI attribution trailers
        if: ${{ !cancelled() }}
        run: python scripts/check_commit_trailers.py
